# 전체 사이트 자동 배포 → 버셀(Vercel) 공개 주소 https://neocollar.vercel.app (프로젝트 neocolor)
# 정식 오픈 전에는 neocolor.net·neo-collar.com 에 '준비 중' 화면만 보이고(public/_redirects),
# 전체 사이트는 여기서 버셀에 올려서 본다. 로그인 없이 누구나 볼 수 있다 (2026-11-07 소유자: "형님도 수정할 수 있는 공개로")
# 버셀에는 NEOCOLLAR 이름 사이트(neo-collar/)를 올린다 (2026-11-07 소유자: "NEO-COLLAR로 바꿔야지 당연히")
# main 에 들어온 수정은 누가 했든(소유자·형님) 자동으로 tools/deploy_vercel.sh 가 올린다.
# 버셀 GitHub 연결은 쓰지 않는다: 커밋 작성자(Claude·형님)가 소유자 버셀 계정이 아니면 무료 요금제에서 배포가 막히기 때문
# 필요한 열쇠(저장소 Settings → Secrets and variables → Actions, 소유자가 넣음):
#   VERCEL_TOKEN : 소유자 버셀 계정 Account Settings → Tokens 에서 만든 열쇠
# 열쇠가 아직 없으면 실패하지 않고 건너뛴다.
name: 버셀 배포 (전체 사이트)

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "neo-collar/**"
      - "tools/make_neo_collar.py"
      - "tools/deploy_vercel.sh"
      - ".github/workflows/vercel.yml"
  workflow_dispatch:

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: 열쇠가 없으면 건너뜀
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN 이 아직 없어서 버셀 배포를 건너뜁니다."

      - uses: actions/checkout@v4
        if: env.VERCEL_TOKEN != ''

      - name: public/ 에서 neo-collar/ 다시 만들기 (이름만 NEOCOLLAR로)
        if: env.VERCEL_TOKEN != ''
        run: python3 tools/make_neo_collar.py

      - name: 버셀에 올리기
        if: env.VERCEL_TOKEN != ''
        run: bash tools/deploy_vercel.sh
