# neo-collar.com 자동 배포
# main 에 올라올 때마다 public/ 에서 neo-collar/ 를 다시 만들고(이름만 NEOCOLLAR로),
# 소유자 Cloudflare 계정의 Pages 프로젝트 neo-collar 에 올린다.
# 필요한 열쇠(저장소 Settings → Secrets and variables → Actions, 소유자가 넣음):
#   CLOUDFLARE_API_TOKEN  : Cloudflare Pages Edit 권한 열쇠
#   CLOUDFLARE_ACCOUNT_ID : 3767ca5b370e0fea0921e5bdf5e95071
# 열쇠가 아직 없으면 실패하지 않고 건너뛴다.
name: neo-collar.com 배포

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "neo-collar/**"
      - "tools/make_neo_collar.py"
      - ".github/workflows/neo-collar.yml"
  workflow_dispatch:

concurrency:
  group: neo-collar-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: public/ 에서 neo-collar/ 다시 만들기 (이름만 바꿈)
        run: python3 tools/make_neo_collar.py

      - name: 열쇠가 없으면 건너뜀
        if: env.CF_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN 이 아직 없어서 neo-collar.com 배포를 건너뜁니다."

      - name: neo-collar.com 에 올리기
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy neo-collar --project-name=neo-collar --branch=main --commit-dirty=true
